name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        php: ['8.3', '8.4']

    services:
      mariadb:
        image: mariadb:11
        env:
          MARIADB_ROOT_PASSWORD: root
          MARIADB_DATABASE: app
        ports:
          - 3306:3306
        options: >-
          --health-cmd="healthcheck.sh --connect --innodb_initialized"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=20

    steps:
      - uses: actions/checkout@v4

      - uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          extensions: dom, mbstring, pcov, pdo_sqlite, pdo_mysql
          coverage: pcov

      - name: Install MySQL client
        run: sudo apt-get update && sudo apt-get install -y default-mysql-client

      - name: Install dependencies
        run: composer install --prefer-dist --no-interaction --no-progress

      - name: Validate composer.json
        run: composer validate --no-check-publish

      - name: Static analysis
        run: composer stan

      - name: Tests with coverage
        env:
          SCHEMA_MYSQL_HOST: 127.0.0.1
          SCHEMA_MYSQL_PORT: 3306
          SCHEMA_MYSQL_USER: root
          SCHEMA_MYSQL_PASSWORD: root
        run: vendor/bin/pest --coverage --min=80
